name: Bug Report
description: Report a bug to help improve Blazing.Mvvm
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue briefly. Please post code snippets in backticks (not screenshots) so they can be copied.
      placeholder: Describe your issue!
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction steps
      description: How do you trigger this bug? Please walk us through it step by step.
      value: |
        1.
        2.
        3.
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output. This is automatically formatted into code, so no backticks are needed.
      render: Shell
  - type: input
    id: bug-version
    attributes:
      label: Version (bug)
      description: Which version of Blazing.Mvvm are you experiencing the issue with?
      placeholder: e.g. 3.2.1
    validations:
      required: true
  - type: input
    id: working-version
    attributes:
      label: Version (working)
      description: Did it work on a previous version? If so, which one?
      placeholder: e.g. 3.1.0
  - type: dropdown
    id: hosting-model
    attributes:
      label: Blazor hosting model
      description: On which hosting model(s) do you see the issue?
      multiple: true
      options:
        - Blazor Server
        - Blazor WebAssembly (WASM)
        - Static Server-Side Rendering (SSR)
        - Auto
        - Hybrid (WPF / WinForms / Avalonia)
        - MAUI
        - Other
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      description: Which .NET version(s) are you targeting?
      placeholder: e.g. .NET 10
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Pull Request
      description: Are you interested in submitting a fix via a Pull Request? That is the fastest way to resolve your issue. We appreciate every contribution!
      options:
        - label: I would like to do a Pull Request
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/gragra33/Blazing.Mvvm/blob/master/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
